user daemon
pidfile /var/run/sniproxy.pid

resolver {
    nameserver 8.8.8.8
    nameserver 1.1.1.1
    mode ipv4_only
}

listen 0.0.0.0:443 {
    proto tls
    table https_hosts
}

table https_hosts {
    .*google\.com$ *
    .*gemini\.google\.com$ *
    .*alkalimeta\.google$ *
    .*generativelanguage\.googleapis\.com$ *
    .*googleapis\.com$ *
    .*deepmind\.com$ *
    .*deepmind\.google$ *
    .*notebooklm\.google$ *
    .*bard\.google\.com$ *
    .*aistudio\.google\.com$ *
    .*gstatic\.com$ *
    .*googleusercontent\.com$ *
    .*waa-pa\.clients6\.google\.com$ *
    .*openai\.com$ *
    .*chatgpt\.com$ *
    .*oaistatic\.com$ *
    .*oaiusercontent\.com$ *
    .*sora\.com$ *
    .*anthropic\.com$ *
    .*claude\.ai$ *
    .*claudeusercontent\.com$ *
    .*spotify\.com$ *
    .*scdn\.co$ *
    .*spotifycdn\.com$ *
    .*spotifycdn\.net$ *
    .*audio-ak-spotify-com\.akamaized\.net$ *
    .*audio4-ak-spotify-com\.akamaized\.net$ *
    .*heads-ak-spotify-com\.akamaized\.net$ *
    .*heads4-ak-spotify-com\.akamaized\.net$ *
    .*pscdn\.co$ *
    .*spoti\.fi$ *
    .*openrouter\.ai$ *
}
